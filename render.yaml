services:
  - type: web
    name: rajput-multi-downloader
    runtime: python
    plan: free

    buildCommand: >
      pip install --upgrade --no-cache-dir -r requirements.txt &&
      curl -fsSL https://deno.land/install.sh | sh

    startCommand: >
      export PATH="$HOME/.deno/bin:$PATH" &&
      gunicorn app:app --bind 0.0.0.0:$PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
